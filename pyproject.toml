[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-guard"
version = "0.1.0"
authors = [
  { name="Your Name", email="you@example.com" },
]
description = "A Post-Quantum Cryptography (PQC) & Attack-Surface Auditor for the Community."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.scripts]
quantum-guard = "quantum_guard.cli:main"
